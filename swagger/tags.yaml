tags:
  - name: auth
    description: Register, login, logout, GET refresh-token via cookie, and forgot-password flows. Refresh uses an HttpOnly cookie.
  - name: users
    description: Profile - GET/PATCH /users/me, GET /users/:username, PUT /users/change-password
  - name: oauth
    description: Google OAuth - GET `/oauth/google/url`, GET `/oauth/google` (callback + Set-Cookie + redirect frontend)
  - name: media
    description: Upload and manage media assets, including images and videos.
  - name: posts
    description: Manage posts, feeds, comments, likes, and bookmarks.
  - name: friends
    description: Friend relationships, including requests, accept/decline actions, friend lists, and unfriending.
  - name: blocks
    description: Block and unblock users, automatically removing friendships and related requests.
  - name: search
    description: Search posts and users.
  - name: conversations
    description: Conversation HTTP APIs for direct/group chats, messages, and read state.
  - name: notifications
    description: In-app notifications with cursor listing and read-state updates.
  - name: roles
    description: System roles (ADMIN, USER). Admin-only list and permissionId management.
  - name: permissions
    description: Permission records by path and method, seeded from routes. Admin-only.
  - name: static
    description: Serve static image and video files.
