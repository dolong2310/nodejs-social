components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access Token (JWT)
    apiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: API key credential for routes protected by ApiKeyGuard.
    refreshTokenCookie:
      type: apiKey
      in: cookie
      name: refreshToken
      description: HttpOnly cookie set by the server during login, refresh, or Google OAuth. It is not returned in the JSON response.
