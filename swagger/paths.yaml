          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==================== SEARCH ====================
  /search:
    get:
      tags: [search]
      summary: Search
      description: The `query` parameter is optional and defaults to an empty string. Bearer token is optional. When provided, results are filtered in the user's context.
      operationId: search
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: [post, user, image, video, video-stream]
        - name: people
          in: query
          schema:
            type: string
            enum: [friends, not_friends, only_me]
        - name: limit
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Success - `data.items` plus `data.nextCursor` (posts or users depending on `type`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchCursorSuccessResponse'

  # ==================== CHATS (Phase 4) ====================
  /conversations/direct:
    post:
      tags: [conversations]
      summary: Open or create a direct chat with a friend (peerUserId)
      operationId: createDirectChat
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [peerUserId]
              properties:
                peerUserId: { $ref: '#/components/schemas/MongoId' }
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSuccessResponse'
  /conversations/groups:
    post:
      tags: [conversations]
      summary: Create a group chat (creator is admin; memberIds must be creator's friends)
      operationId: createGroupChat
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [memberIds]
              properties:
                name: { type: string }
                memberIds:
                  type: array
                  items: { $ref: '#/components/schemas/MongoId' }
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSuccessResponse'
  /conversations:
    get:
      tags: [conversations]
      summary: List conversations (cursor + limit)
      operationId: listChats
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatListSuccessResponse'
  /conversations/{conversationId}:
    get:
      tags: [conversations]
      summary: Get chat detail and members
      operationId: getChatDetail
      security: [{ bearerAuth: [] }]
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/MongoId' }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatDetailSuccessResponse'
    patch:
      tags: [conversations]
      summary: Update chat name or avatar (admin or manager)
      operationId: patchChat
      security: [{ bearerAuth: [] }]
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/MongoId' }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                avatarMediaId: { $ref: '#/components/schemas/MongoId' }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSuccessResponse'
  /conversations/{conversationId}/messages:
    get:
      tags: [conversations]
      summary: List message history (cursor, newest first)
      operationId: listChatMessages
      security: [{ bearerAuth: [] }]
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/MongoId' }
        - name: limit
          in: query
          schema: { type: integer, default: 30 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessagesPageSuccessResponse'
    post:
      tags: [conversations]
      summary: Send a message (text and/or attachments; max 5MB per file)
      operationId: sendChatMessage
      security: [{ bearerAuth: [] }]
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/MongoId' }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string }
                attachments:
                  type: array
                  items:
                    $ref: '#/components/schemas/ChatAttachment'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessageSuccessResponse'
  /conversations/{conversationId}/read:
    patch:
      tags: [conversations]
      summary: Mark as read (optional lastReadMessageId; defaults to the newest message)
      operationId: markChatRead
      security: [{ bearerAuth: [] }]
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/MongoId' }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                lastReadMessageId: { $ref: '#/components/schemas/MongoId' }
      responses:
        '200':
          description: OK
  /conversations/{conversationId}/members:
    post:
      tags: [conversations]
      summary: Invite a member to a group
      operationId: inviteChatMember
      security: [{ bearerAuth: [] }]
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/MongoId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { $ref: '#/components/schemas/MongoId' }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatDetailSuccessResponse'
  /conversations/{conversationId}/members/me:
    delete:
      tags: [conversations]
      summary: Leave a group or chat
      operationId: leaveChat
      security: [{ bearerAuth: [] }]
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/MongoId' }
      responses:
        '200':
          description: OK
  /conversations/{conversationId}/members/{userId}:
    delete:
      tags: [conversations]
      summary: Kick a member (admin/manager permissions apply)
      operationId: kickChatMember
      security: [{ bearerAuth: [] }]
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/MongoId' }
        - name: userId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/MongoId' }
      responses:
        '200':
          description: OK
  /conversations/{conversationId}/members/{userId}/role:
    patch:
      tags: [conversations]
      summary: Change member role between manager and member (admin only)
      operationId: patchChatMemberRole
      security: [{ bearerAuth: [] }]
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/MongoId' }
        - name: userId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/MongoId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [manager, member] }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatDetailSuccessResponse'
  /conversations/{conversationId}/admin/transfer:
    post:
      tags: [conversations]
      summary: Transfer admin ownership (previous admin becomes manager)
      operationId: transferChatAdmin
      security: [{ bearerAuth: [] }]
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/MongoId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newAdminUserId]
              properties:
                newAdminUserId: { $ref: '#/components/schemas/MongoId' }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatDetailSuccessResponse'

  # ==================== NOTIFICATIONS ====================
  /notifications:
    get:
      tags: [notifications]
      summary: List notifications (cursor, optional unreadOnly)
      operationId: listNotifications
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          schema: { type: string }
        - name: unreadOnly
          in: query
          description: 'true | false - return unread notifications only'
          schema: { type: string, enum: ['true', 'false', '1', '0'] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationsPageSuccessResponse'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /notifications/read:
    patch:
      tags: [notifications]
      summary: Mark notifications as read (batch or all)
      operationId: markNotificationsRead
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items: { $ref: '#/components/schemas/MongoId' }
                  description: Omit or leave empty to mark all as read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /notifications/{notificationId}/read:
    patch:
      tags: [notifications]
      summary: Mark one notification as read
      operationId: markOneNotificationRead
      security: [{ bearerAuth: [] }]
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/MongoId' }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==================== ROLES & PERMISSIONS (admin) ====================
  /roles:
    get:
      tags: [roles]
      summary: List roles
      description: '**ADMIN** only (matches `roleId` against the system role). Uses `page` + `limit` pagination (1-100).'
      operationId: listRoles
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Success - same pagination shape as `GET /blocks` (`data.data` is an array of roles)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleListPageSuccessResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [roles]
      summary: Create a role
      description: '**ADMIN** only. The `name` must be unique; duplicate names return 409.'
      operationId: createRole
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleItemSuccessResponse'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Role name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /roles/{roleId}:
    get:
      tags: [roles]
      summary: Get role detail
      description: '**ADMIN** only.'
      operationId: getRole
      security: [{ bearerAuth: [] }]
      parameters:
        - name: roleId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/MongoId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleItemSuccessResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Role not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [roles]
      summary: Update a role
      description: '**ADMIN** only. System roles ADMIN/USER cannot be renamed or deleted; duplicate names return 409.'
      operationId: updateRole
      security: [{ bearerAuth: [] }]
      parameters:
        - name: roleId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/MongoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleItemSuccessResponse'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not an admin, or the operation was denied for a system role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Role not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: New name conflicts with another role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [roles]
      summary: Delete a role
      description: '**ADMIN** only. System roles ADMIN/USER cannot be deleted.'
      operationId: deleteRole
      security: [{ bearerAuth: [] }]
      parameters:
        - name: roleId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/MongoId'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not an admin, or the system role cannot be deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Role not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /permissions:
    get:
      tags: [permissions]
      summary: List permissions
      description: '**ADMIN** only. Uses `page` + `limit` pagination (1-100).'
      operationId: listPermissions
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionListPageSuccessResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [permissions]
      summary: Create a permission
      description: '**ADMIN** only. The `path` + `method` pair must be unique; duplicates return 409.'
      operationId: createPermission
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePermissionRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionItemSuccessResponse'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: A permission with the same path and method already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /permissions/{permissionId}:
    get:
      tags: [permissions]
      summary: Get permission detail
      description: '**ADMIN** only.'
      operationId: getPermission
      security: [{ bearerAuth: [] }]
      parameters:
        - name: permissionId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/MongoId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionItemSuccessResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [permissions]
      summary: Update a permission
      description: '**ADMIN** only. If `path` or `method` changes, the new pair must not already exist (409).'
      operationId: updatePermission
      security: [{ bearerAuth: [] }]
      parameters:
        - name: permissionId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/MongoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePermissionRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionItemSuccessResponse'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: New path+method pair conflicts with another permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [permissions]
      summary: Delete a permission
      description: '**ADMIN** only. Cannot delete while assigned to any role (409); remove it from roles first.'
      operationId: deletePermission
      security: [{ bearerAuth: [] }]
      parameters:
        - name: permissionId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/MongoId'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Permission is assigned to at least one role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==================== STATIC ====================
  /static/images/{filename}:
    get:
      tags: [static]
      summary: Get a static image
      operationId: getStaticImage
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Image file
          content:
            image/*:
              schema:
                type: string
                format: binary
        '404':
          description: File not found
  /static/videos-stream/{filename}:
    get:
      tags: [static]
      summary: Stream video (Range supported)
      operationId: getStaticVideoStream
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
        - name: Range
          in: header
          description: bytes=start-
          schema:
            type: string
      responses:
        '206':
          description: Partial content
        '404':
          description: File not found
  /static/videos-stream/{id}/master.m3u8:
    get:
      tags: [static]
      summary: Get stream master playlist
      operationId: getStaticVideoStreamMaster
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Stream master playlist
        '404':
          description: Not found
  /static/videos-stream/{id}/{version}/{segment}:
    get:
      tags: [static]
      summary: Get stream segment
      operationId: getStaticVideoStreamSegment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          schema:
            type: string
        - name: segment
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Stream segment
        '404':
          description: Not found
