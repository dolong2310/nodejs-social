paths:
  # ==================== AUTH ====================
  /auth/register:
    post:
      tags: [auth]
      summary: Register an account
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/login:
    post:
      tags: [auth]
      summary: Login
      operationId: login
      description: Returns `accessToken` in JSON; `refreshToken` is set through the HttpOnly `Set-Cookie` header.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful, including the refreshToken Set-Cookie header
          headers:
            Set-Cookie:
              schema:
                type: string
                example: refreshToken=...; Path=/; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Email or password is incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/logout:
    post:
      tags: [auth]
      summary: Logout
      operationId: logout
      description: Requires a Bearer access token and the `refreshToken` cookie. The request body is not used.
      security:
        - bearerAuth: []
          refreshTokenCookie: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/refresh-token:
    get:
      tags: [auth]
      summary: Refresh access token
      operationId: refreshToken
      description: |
        Reads the refresh token from the HttpOnly cookie; returns `accessToken` in the body; the new refresh token is set through Set-Cookie.
        Call with `credentials: include` (CORS). **Method: GET** - no body.
      security:
        - refreshTokenCookie: []
      responses:
        '200':
          description: Token refreshed successfully, including the new refreshToken Set-Cookie header
          headers:
            Set-Cookie:
              schema:
                type: string
                example: refreshToken=...; Path=/; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
  /auth/forgot-password:
    post:
      tags: [auth]
      summary: Forgot password
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Password reset email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Email does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==================== PAYMENTS ====================
  /payments:
    post:
      tags: [payments]
      summary: Create a sandbox order payment
      operationId: createPayment
      description: Creates a fixed 10,000 VND order payment and returns a provider checkout URL. VNPay and MoMo are sandbox-only in every app environment.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
          description: Reuse the same key to safely retry this request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
      responses:
        '201':
          description: Payment created or returned for the same idempotency key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentSuccessResponse'
        '400':
          description: Invalid provider or missing Idempotency-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /payments/{paymentId}:
    get:
      tags: [payments]
      summary: Get the current user's payment status
      operationId: getPayment
      security: [{ bearerAuth: [] }]
      parameters:
        - name: paymentId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/MongoId' }
      responses:
        '200':
          description: Payment status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentSuccessResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Payment not found for the current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /payments/callbacks/vnpay/ipn:
    get:
      tags: [payments]
      summary: VNPay server-to-server IPN
      operationId: receiveVnpayIpn
      description: Configure this HTTPS URL in the VNPay sandbox merchant settings. The API verifies the signature and persists the notification before acknowledging it.
      security: []
      responses:
        '200':
          description: VNPay protocol response with RspCode and Message
          content:
            application/json:
              schema:
                type: object
                required: [RspCode, Message]
                properties:
                  RspCode: { type: string, example: '00' }
                  Message: { type: string, example: Success }
  /payments/callbacks/vnpay/return:
    get:
      tags: [payments]
      summary: VNPay browser return
      operationId: receiveVnpayReturn
      description: Read-only return page. The payment state is updated only by the verified VNPay IPN.
      security: []
      responses:
        '200':
          description: User-facing instruction to check payment status in the application
          content:
            text/plain:
              schema: { type: string }
  /payments/callbacks/momo/ipn:
    post:
      tags: [payments]
      summary: MoMo server-to-server IPN
      operationId: receiveMomoIpn
      description: Verifies the MoMo signature and persists the notification. A 204 response means the notification was applied or was an idempotent duplicate.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MomoIpnRequest'
      responses:
        '204':
          description: Notification applied or duplicate
        '400':
          description: Invalid signature, payload, order, or amount
        '409':
          description: Payment is in a conflicting final state
        '500':
          description: Notification could not be durably processed; provider may retry
  /payments/callbacks/momo/return:
    get:
      tags: [payments]
      summary: MoMo browser return
      operationId: receiveMomoReturn
      description: Read-only return page. The payment state is updated only by the verified MoMo IPN.
      security: []
      responses:
        '200':
          description: User-facing instruction to check payment status in the application
          content:
            text/plain:
              schema: { type: string }

  # ==================== USERS ====================
  /users/me:
    get:
      tags: [users]
      summary: Get the current user
      operationId: getMe
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSuccessResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags: [users]
      summary: Update the current user
      operationId: updateMe
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200':
          description: Updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSuccessResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /users/{username}:
    get:
      tags: [users]
      summary: Get a user by username
      operationId: getUserProfile
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSuccessResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /users/change-password:
    put:
      tags: [users]
      summary: Change password for an authenticated and verified user
      operationId: changePassword
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==================== OAUTH ====================
  /oauth/google/url:
    get:
      tags: [oauth]
      summary: Get Google authorization URL (PKCE/state)
      operationId: getGoogleAuthUrl
      parameters:
        - name: ip
          in: query
          required: true
          schema: { type: string }
        - name: userAgent
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Google login URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthUrlSuccessResponse'
  /oauth/google:
    get:
      tags: [oauth]
      summary: Login with Google
      operationId: googleLogin
      description: |
        OAuth callback (query `code`): the server creates a session, sets the HttpOnly `refreshToken` cookie, and redirects with `302` to `{FRONTEND_URL}/oauth/callback`.
        The client must call `POST /auth/refresh-token` with credentials/cookies to receive the `accessToken` in JSON.
      responses:
        '302':
          description: Redirects to the frontend after setting the cookie, or redirects to Google when starting the flow depending on the client implementation

  # ==================== MEDIA ====================
  /media/upload-image:
    post:
      tags: [media]
      summary: Upload an image
      operationId: uploadImage
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
      responses:
        '200':
          description: Upload successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUploadResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /media/upload-video:
    post:
      tags: [media]
      summary: Upload video
      operationId: uploadVideo
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                video:
                  type: string
                  format: binary
      responses:
        '200':
          description: Upload successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUploadResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /media/upload-video-stream:
    post:
      tags: [media]
      summary: Upload video Stream
      operationId: uploadVideoStream
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                video:
                  type: string
                  format: binary
      responses:
        '200':
          description: Upload successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUploadResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /media/video-status/{id}:
    get:
      tags: [media]
      summary: Get video upload/encoding status
      operationId: getVideoStatus
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoStatusResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==================== POSTS ====================
  /posts:
    get:
      tags: [posts]
      summary: Get the news feed
      description: Bearer token is optional. With a token, the feed is merged from public posts, friends' posts, and the user's own posts with block filtering applied. Without a token, only public posts are returned. Unverified users can still read when sending a token. Uses **cursor** pagination (`limit` is required by validation, 1-100).
      operationId: getNewFeeds
      parameters:
        - name: limit
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: cursor
          in: query
          required: false
          description: Opaque cursor to send on the next request for the next page
          schema:
            type: string
      responses:
        '200':
          description: Success - `data.items` plus `data.nextCursor`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostFeedCursorSuccessResponse'
    post:
      tags: [posts]
      summary: Create a new post
      operationId: createPost
      security: [{ bearerAuth: [] }]
      description: Requires a Bearer token; the user must have verified their email when Authorization is provided.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
      responses:
        '201':
          description: Post created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostSuccessResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /posts/users/{userId}:
    get:
      tags: [posts]
      summary: List posts by user
      operationId: getPostsByUser
      description: Bearer token is optional. When `type` is omitted, all post types are returned. Visibility is evaluated for the viewer; guests only see public posts.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [post, repost, comment, quote]
        - name: limit
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: cursor
          in: query
          required: false
          description: Opaque cursor to send on the next request for the next page
          schema:
            type: string
      responses:
        '200':
          description: Success - `data.items` plus `data.nextCursor`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostFeedCursorSuccessResponse'
        '401':
          description: Invalid token when Authorization is provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Profile cannot be viewed because of block rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /posts/{postId}:
    get:
      tags: [posts]
      summary: Get post detail
      operationId: getPostDetail
      description: Bearer token is optional; guests can only view public posts.
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDetailSuccessResponse'
        '401':
          description: Invalid token when Authorization is provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not allowed to view this post due to audience, block rules, or other visibility rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags: [posts]
      summary: Owner updates audience and allowStrangerComments
      operationId: patchPost
      security: [{ bearerAuth: [] }]
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchPostRequest'
      responses:
        '200':
          description: Updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostSuccessResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not the post owner or not verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /posts/{type}/{postId}:
    get:
      tags: [posts]
      summary: List posts by type (comments, quotes, reposts)
      operationId: getPostsType
      description: Bearer token is optional; visibility follows the parent post audience.
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [post, repost, comment, quote]
        - name: postId
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Success - `data.items` plus `data.nextCursor`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostFeedCursorSuccessResponse'
        '401':
          description: Invalid token when Authorization is provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not allowed to view the parent post
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==================== POST BOOKMARKS ====================
  /posts/bookmarks:
    post:
      tags: [posts]
      summary: Bookmark a post
      operationId: createBookmark
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookmarkRequest'
      responses:
        '201':
          description: Bookmark added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookmarkSuccessResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /posts/bookmarks/{postId}:
    delete:
      tags: [posts]
      summary: Remove a post bookmark
      operationId: deleteBookmark
      security: [{ bearerAuth: [] }]
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Bookmark removed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==================== POST LIKES ====================
  /posts/likes:
    post:
      tags: [posts]
      summary: Like a post
      operationId: createLike
      security: [{ bearerAuth: [] }]
      description: Requires a verified account; uses the same post visibility rules as bookmarks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLikeRequest'
      responses:
        '201':
          description: Liked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LikeSuccessResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not verified or not allowed to view the post
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /posts/likes/{postId}:
    delete:
      tags: [posts]
      summary: Unlike a post
      operationId: deleteLike
      security: [{ bearerAuth: [] }]
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Unliked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==================== FRIENDS ====================
  /friends:
    get:
      tags: [friends]
      summary: List friends
      operationId: listFriends
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Success - `data.items` (FriendUserSummary) plus `data.nextCursor`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendListCursorSuccessResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /friends/requests:
    post:
      tags: [friends]
      summary: Send a friend request
      operationId: sendFriendRequest
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendFriendRequestBody'
      responses:
        '201':
          description: Friend request sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendRequestCreatedResponse'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Blocked or not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Already friends or a pending request already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Exceeded the limit of 100 outgoing friend requests per UTC day (D-07)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /friends/requests/incoming:
    get:
      tags: [friends]
      summary: List incoming friend requests
      operationId: listIncomingFriendRequests
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Success - cursor pagination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendListCursorSuccessResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /friends/requests/outgoing:
    get:
      tags: [friends]
      summary: List outgoing friend requests
      operationId: listOutgoingFriendRequests
