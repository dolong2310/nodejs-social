openapi: 3.1.0
info:
  title: NodeJS Social API
  description: |
    API documentation for the NodeJS Social networking application (clean architecture: `src/presentation/http`, use cases in `src/modules/*/application`).

    **Base path:** all routes except documentation are mounted under the `/api` prefix (for example, login: `POST /api/auth/login`).
    **Swagger UI:** `/api/docs`.

    **Auth:** `Authorization: Bearer <accessToken>` for user authentication; `x-api-key: <API_KEY>` for routes protected by API key. Some routes may require both when they use both `AuthGuard` and `ApiKeyGuard`. Refresh tokens are sent only through the HttpOnly `refreshToken` cookie. Refresh access with `GET /api/auth/refresh-token` (no body).

    **Response format:**
    - Success: `{ message, statusCode, data? }` - `SuccessResponse`
    - Error: `{ message, errors }` - `ErrorResponse`
    - Cursor pagination (feeds, search, friends, etc.): `data: { items, nextCursor }`
    - Page pagination (for example, blocked users): `data: { data, page, limit, totalItems, totalPages, hasNext, hasPrev }`
  version: 1.0.0
  contact:
    email: support@nodejs-social.com
servers:
  - url: http://localhost:8080/api
    description: Development server (PORT comes from the environment, commonly defaults to 8080)
  - url: https://api.nodejs-social.com/api
    description: Production server
paths: {}
